<!-- @example: Titled card with actions -->
<section class="tx-card" aria-labelledby="card-demo-title">
  <header class="tx-card__head">
    <div class="tx-card__titles">
      <h2 class="tx-card__title" id="card-demo-title">Promotion summary</h2>
      <p class="tx-card__subtitle">Last updated 4 Nov 2026</p>
    </div>
    <div class="tx-card__actions">
      <button type="button" class="tx-btn tx-btn--sm">Edit</button>
    </div>
  </header>
  <div class="tx-card__body">
    <p>Card content goes here. Use tx-stack or tx-grid inside to space children.</p>
  </div>
  <footer class="tx-card__foot">
    <span class="tx-muted">3 of 12 steps complete</span>
    <button type="button" class="tx-btn tx-btn--sm tx-btn--primary">Continue</button>
  </footer>
</section>

<!-- @example: Section title over a group -->
<div class="tx-section-title"><h2>Markets</h2><button type="button" class="tx-btn tx-btn--ghost tx-btn--sm">See all</button></div>
