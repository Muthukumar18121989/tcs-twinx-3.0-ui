<!-- @example: Toast -->
<div class="tx-btn-group">
  <button type="button" class="tx-btn" onclick="TwinX.toast('Promotion saved', { tone: 'success' })">Show success toast</button>
  <button type="button" class="tx-btn" onclick="TwinX.toast('Could not reach the server', { tone: 'danger' })">Show error toast</button>
</div>

<!-- @example: Inline alerts -->
<div class="tx-stack tx-stack--sm">
  <div class="tx-alert tx-alert--info"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div><p class="tx-alert__title">Simulation is running</p><p>Results appear here in about two minutes.</p></div></div>
  <div class="tx-alert tx-alert--warning" role="alert"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div><p class="tx-alert__title">Budget above the DOA limit</p><p>This promotion will need director approval.</p></div></div>
  <div class="tx-alert tx-alert--success"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><div><p>Submitted for approval.</p></div></div>
</div>
