<!-- @example: Stack, row and grid -->
<div class="tx-stack">
  <div class="tx-row tx-row--between"><strong>Row: space between</strong><span class="tx-muted">right side</span></div>
  <div class="tx-grid" style="--tx-grid-min: 140px">
    <div class="tx-kpi"><span class="tx-kpi__label">One</span><span class="tx-kpi__value tx-num">1</span></div>
    <div class="tx-kpi"><span class="tx-kpi__label">Two</span><span class="tx-kpi__value tx-num">2</span></div>
    <div class="tx-kpi"><span class="tx-kpi__label">Three</span><span class="tx-kpi__value tx-num">3</span></div>
  </div>
</div>

<!-- @example: Icons -->
<div class="tx-row">
  <svg class="tx-icon tx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <svg class="tx-icon tx-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <span class="tx-sr-only">Three check icons in small, default and large</span>
</div>
