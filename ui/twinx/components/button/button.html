<!-- @example: Primary and secondary -->
<div class="tx-btn-group">
  <button type="button" class="tx-btn tx-btn--primary">Save changes</button>
  <button type="button" class="tx-btn tx-btn--secondary">Cancel</button>
</div>

<!-- @example: With an icon -->
<div class="tx-btn-group">
  <button type="button" class="tx-btn tx-btn--primary"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New promotion</button>
  <button type="button" class="tx-btn tx-btn--secondary"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export</button>
</div>

<!-- @example: Ghost, danger and disabled -->
<div class="tx-btn-group">
  <button type="button" class="tx-btn tx-btn--ghost">Clear filters</button>
  <button type="button" class="tx-btn tx-btn--danger"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
  <button type="button" class="tx-btn tx-btn--primary" disabled>Submit</button>
</div>

<!-- @example: Icon-only and small -->
<div class="tx-btn-group">
  <button type="button" class="tx-btn tx-btn--icon" aria-label="Filter"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></button>
  <button type="button" class="tx-btn tx-btn--icon" aria-label="Download"><svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
  <button type="button" class="tx-btn tx-btn--sm">Edit</button>
  <button type="button" class="tx-btn tx-btn--sm tx-btn--primary">Approve</button>
</div>
