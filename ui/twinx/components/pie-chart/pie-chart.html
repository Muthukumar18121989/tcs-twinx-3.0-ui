<!-- @example: Pie chart -->
<figure class="tx-pie" data-tx-pie>
  <figcaption class="tx-pie__caption">Budget by channel</figcaption>
  <div class="tx-pie__chart"></div>
  <ul class="tx-pie__legend">
    <li class="tx-pie__item" data-value="38"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">TV</span><span class="tx-pie__value">€3.8M</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="27"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Digital</span><span class="tx-pie__value">€2.7M</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="20"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Print</span><span class="tx-pie__value">€2.0M</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="15"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Radio</span><span class="tx-pie__value">€1.5M</span><span class="tx-pie__share"></span></li>
  </ul>
</figure>

<!-- @example: Donut chart with total -->
<figure class="tx-pie tx-pie--donut" data-tx-pie>
  <figcaption class="tx-pie__caption">Volume by market</figcaption>
  <div class="tx-pie__chart"><span class="tx-pie__center"><span class="tx-pie__total">48.2k</span><span class="tx-pie__center-label">Units</span></span></div>
  <ul class="tx-pie__legend">
    <li class="tx-pie__item" data-value="16.4"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">France</span><span class="tx-pie__value">16.4k</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="12.5"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Italy</span><span class="tx-pie__value">12.5k</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="10.1"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Germany</span><span class="tx-pie__value">10.1k</span><span class="tx-pie__share"></span></li>
    <li class="tx-pie__item" data-value="9.2"><span class="tx-pie__swatch" aria-hidden="true"></span><span class="tx-pie__label">Spain</span><span class="tx-pie__value">9.2k</span><span class="tx-pie__share"></span></li>
  </ul>
</figure>
