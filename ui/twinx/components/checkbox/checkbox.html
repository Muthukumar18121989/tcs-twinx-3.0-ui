<!-- @example: Checkboxes -->
<div class="tx-choice-group">
  <label class="tx-check"><input type="checkbox" checked> Include fleet sales</label>
  <label class="tx-check"><input type="checkbox"> Include demo cars</label>
  <label class="tx-check"><input type="checkbox" disabled> Locked option</label>
</div>

<!-- @example: Radio group -->
<fieldset class="tx-choice-group tx-choice-group--row">
  <legend>Period</legend>
  <label class="tx-radio"><input type="radio" name="period" checked> Monthly</label>
  <label class="tx-radio"><input type="radio" name="period"> Quarterly</label>
  <label class="tx-radio"><input type="radio" name="period"> Yearly</label>
</fieldset>

<!-- @example: Switch -->
<label class="tx-switch"><input type="checkbox" role="switch" checked> Email me when approved</label>
