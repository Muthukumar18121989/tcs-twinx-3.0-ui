<!-- @example: Statuses -->
<div class="tx-row">
  <span class="tx-badge tx-badge--neutral">Draft</span>
  <span class="tx-badge tx-badge--progress">In progress</span>
  <span class="tx-badge tx-badge--pending">Pending approval</span>
  <span class="tx-badge tx-badge--success">Approved</span>
  <span class="tx-badge tx-badge--danger">Rejected</span>
  <span class="tx-badge tx-badge--info">Iteration 3</span>
</div>

<!-- @example: Count on an icon button -->
<button type="button" class="tx-btn tx-btn--icon" aria-label="Notifications (5)">
  <svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  <span class="tx-count">5</span>
</button>
