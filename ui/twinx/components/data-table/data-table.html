<!-- @example: Table in a card with pagination -->
<section class="tx-card" aria-labelledby="tbl-demo">
  <header class="tx-card__head"><h2 class="tx-card__title" id="tbl-demo">Experiments</h2><div class="tx-card__actions"><button type="button" class="tx-btn tx-btn--sm tx-btn--primary">New experiment</button></div></header>
  <div class="tx-table-wrap" style="--tx-table-h: 320px">
    <table class="tx-table">
      <caption class="tx-sr-only">Experiments</caption>
      <thead><tr>
        <th scope="col" class="tx-table__sticky-col">ID</th>
        <th scope="col" aria-sort="descending"><button type="button">Name</button></th>
        <th scope="col">Market</th>
        <th scope="col">Status</th>
        <th scope="col" class="is-num">Volume</th>
        <th scope="col" class="is-num">Uplift</th>
      </tr></thead>
      <tbody>
        <tr><td class="tx-table__sticky-col is-muted">EXP-1042</td><td class="is-strong">Spring offer 2027</td><td>France</td><td><span class="tx-badge tx-badge--success">Approved</span></td><td class="is-num">12,480</td><td class="is-num">8.6%</td></tr>
        <tr class="is-selected"><td class="tx-table__sticky-col is-muted">EXP-1041</td><td class="is-strong">Fleet bonus Q1</td><td>Germany</td><td><span class="tx-badge tx-badge--pending">Pending</span></td><td class="is-num">3,210</td><td class="is-num">4.1%</td></tr>
        <tr><td class="tx-table__sticky-col is-muted">EXP-1039</td><td class="is-strong">EV launch support</td><td>Italy</td><td><span class="tx-badge tx-badge--progress">In progress</span></td><td class="is-num">7,905</td><td class="is-num">11.2%</td></tr>
      </tbody>
    </table>
  </div>
  <footer class="tx-card__foot">
    <span class="tx-muted">Showing 1–3 of 48</span>
    <nav class="tx-pagination" aria-label="Pages">
      <button type="button" class="tx-pagination__arrow" aria-label="Previous page"><svg class="tx-icon tx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" class="tx-pagination__page" aria-current="page">1</button>
      <button type="button" class="tx-pagination__page">2</button>
      <button type="button" class="tx-pagination__page">3</button>
      <button type="button" class="tx-pagination__arrow" aria-label="Next page"><svg class="tx-icon tx-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
  </footer>
</section>

<!-- @example: Dense table with column lines -->
<div class="tx-table-wrap">
  <table class="tx-table tx-table--dense tx-table--lines">
    <thead><tr><th scope="col">Month</th><th scope="col" class="is-num">Units</th><th scope="col" class="is-num">Recommended</th><th scope="col" class="is-num">Share</th></tr></thead>
    <tbody>
      <tr><td>Jan</td><td class="is-num">1,020</td><td class="is-num">1,100</td><td class="is-num">8.2%</td></tr>
      <tr><td>Feb</td><td class="is-num">980</td><td class="is-num">1,050</td><td class="is-num">7.9%</td></tr>
    </tbody>
  </table>
</div>
